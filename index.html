<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ClearScope Technologies — 3D Architectural Walkthrough & Network Model</title>
<style>
:root {
  color-scheme: dark;
  --glass-bg: rgba(10, 18, 34, 0.78);
  --glass-border: rgba(56, 189, 248, 0.22);
  --glass-hover: rgba(56, 189, 248, 0.15);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --cyan-accent: #38bdf8;
  --green-accent: #34d399;
  --amber-accent: #fbbf24;
  --red-accent: #f87171;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #020617;
  color: var(--text-main);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  overflow: hidden;
  user-select: none;
}
#scene { position: fixed; inset: 0; }

/* Frosted Glass Floating Panels */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
}

/* TOP FLOATING NAV BAR */
#topNav {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.nav-capsule {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.nav-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--cyan-accent);
  padding: 0 10px 0 6px;
  border-right: 1px solid rgba(148, 163, 184, 0.25);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.nav-brand-dot {
  width: 6px;
  height: 6px;
  background: var(--cyan-accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--cyan-accent);
}
.nav-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.nav-btn:hover {
  color: #fff;
  background: var(--glass-hover);
}
.nav-btn.active {
  background: rgba(14, 165, 233, 0.25);
  border-color: rgba(56, 189, 248, 0.4);
  color: var(--cyan-accent);
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
}

/* FLOOR SELECTOR SUB-BAR */
#floorSubNav {
  pointer-events: auto;
  display: none;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 999px;
  animation: fadeIn 0.25s ease;
}
.floor-lbl {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  padding: 0 6px;
}
.floor-pill {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.floor-pill:hover { color: #fff; background: var(--glass-hover); }
.floor-pill.active {
  background: rgba(52, 211, 153, 0.2);
  border-color: rgba(52, 211, 153, 0.4);
  color: var(--green-accent);
}

/* FLOATING BOTTOM DOCK */
#bottomDock {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
}
.dock-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}
.dock-btn:hover { color: #fff; background: var(--glass-hover); }
.dock-btn.active {
  background: rgba(14, 165, 233, 0.2);
  border-color: rgba(56, 189, 248, 0.35);
  color: var(--cyan-accent);
}
.dock-sep {
  width: 1px;
  height: 14px;
  background: rgba(148, 163, 184, 0.25);
}
.dock-stat {
  font-size: 11px;
  font-family: Consolas, monospace;
  color: var(--cyan-accent);
  padding: 0 4px;
}

/* POPUP TEST DRAWER (BOTTOM LEFT) */
#testDrawer {
  position: fixed;
  bottom: 60px;
  left: 18px;
  width: 388px;
  z-index: 50;
  padding: 14px;
  display: none;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.15);
}
.drawer-title {
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.drawer-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
}
.drawer-close:hover { color: #fff; }
.test-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 8px;
}
.t-btn {
  background: #0b1324;
  border: 1px solid rgba(148, 163, 184, 0.25);
  color: #e2e8f0;
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}
.t-btn:hover { background: #1e293b; border-color: var(--cyan-accent); color: #fff; }
.t-btn.sim-active {
  background: #0f2744;
  border-color: var(--cyan-accent);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
  color: #fff;
}
.t-btn-red { background: #450a0a; border-color: #ef4444; color: #fca5a5; }
.t-btn-red:hover { background: #7f1d1d; color: #fff; }
.t-btn-red.sim-active {
  background: #7f1d1d;
  border-color: #f87171;
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.55);
  color: #fff;
}
.sim-console {
  background: #020617;
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 7px;
  padding: 8px 10px;
  font-family: Consolas, 'SF Mono', monospace;
  font-size: 10.5px;
  color: var(--cyan-accent);
  min-height: 72px;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.45;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

/* CINEMATIC CHASE TRACKING PILL */
#simTrackingPill {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 45;
  padding: 6px 16px;
  display: none;
  background: rgba(8, 15, 30, 0.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(56, 189, 248, 0.45);
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  font-size: 11.5px;
  font-weight: 600;
  color: #f8fafc;
  pointer-events: none;
  align-items: center;
  gap: 8px;
  animation: fadeIn 0.2s ease;
}
.tracking-pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 10px #38bdf8;
  animation: blink 0.8s infinite alternate;
}
@keyframes blink {
  from { opacity: 0.3; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1.2); }
}

/* EXECUTIVE DEFENSE DEBRIEF MODAL (NO SCROLLBAR, GORGEOUS GLASS) */
#simBigScreen {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: min(680px, calc(100vw - 32px));
  z-index: 55;
  padding: 20px 24px;
  display: none;
  background: rgba(10, 16, 32, 0.88);
  backdrop-filter: blur(24px) saturate(190%);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(56, 189, 248, 0.12);
  animation: debriefPop 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
}

@keyframes debriefPop {
  from { opacity: 0; transform: translate(-50%, -10px) scale(0.97); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

.big-screen-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}
.big-screen-icon {
  font-size: 22px;
  display: flex;
  align-items: center;
}
.big-screen-title {
  font-size: 14.5px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.3px;
}
.big-screen-subtitle {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 1px;
}
.big-screen-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 7px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  white-space: nowrap;
}

.badge-success { background: rgba(6, 78, 59, 0.9); color: #6ee7b7; border: 1px solid #10b981; }
.badge-danger  { background: rgba(127, 29, 29, 0.9); color: #fca5a5; border: 1px solid #ef4444; }
.badge-sync    { background: rgba(12, 74, 110, 0.9); color: #7dd3fc; border: 1px solid #38bdf8; }
.badge-amber   { background: rgba(120, 53, 15, 0.9); color: #fde68a; border: 1px solid #f59e0b; }

/* Clean Flex-Wrap Breadcrumbs (Zero Ugly Scrollbar) */
.big-screen-hops {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}
.hop-step {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.2);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: #94a3b8;
}
.hop-step.completed {
  border-color: rgba(52, 211, 153, 0.4);
  color: #6ee7b7;
  background: rgba(6, 78, 59, 0.3);
}
.hop-step.completed-red {
  border-color: rgba(239, 68, 68, 0.5);
  color: #fca5a5;
  background: rgba(127, 29, 29, 0.35);
}
.hop-arrow {
  color: rgba(148, 163, 184, 0.35);
  font-size: 10px;
}

.big-screen-desc {
  font-size: 12px;
  line-height: 1.6;
  color: #e2e8f0;
  margin-bottom: 12px;
  background: rgba(2, 6, 23, 0.6);
  padding: 11px 14px;
  border-radius: 8px;
  border-left: 3px solid var(--cyan-accent);
}
.big-screen-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.bs-meta-item {
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid rgba(148, 163, 184, 0.2);
  padding: 7px 10px;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.bs-meta-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
  font-weight: 600;
}
.bs-meta-val {
  font-size: 11.5px;
  color: #f8fafc;
  font-family: inherit;
  font-weight: 600;
  white-space: normal;
  word-break: break-word;
  line-height: 1.35;
}

.big-screen-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid rgba(148, 163, 184, 0.15);
}
.bs-act-btn {
  background: #1e293b;
  border: 1px solid rgba(148, 163, 184, 0.3);
  color: #f8fafc;
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.bs-act-btn:hover {
  background: #334155;
  border-color: var(--cyan-accent);
}
.bs-act-primary {
  background: #0284c7;
  border-color: #38bdf8;
  color: #fff;
}
.bs-act-primary:hover {
  background: #0369a1;
}

/* SLIDE-OVER DEVICE INSPECTOR (RIGHT) */
#inspectorDrawer {
  position: fixed;
  top: 14px;
  right: 14px;
  width: 340px;
  max-height: calc(100vh - 28px);
  z-index: 50;
  padding: 16px;
  display: none;
  overflow-y: auto;
  animation: slideLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.insp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.2);
}
.insp-name {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}
.insp-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.insp-badge {
  font-size: 9.5px;
  font-family: Consolas, monospace;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: var(--cyan-accent);
}
.insp-card {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 10px;
}
.spec-line {
  display: grid;
  grid-template-columns: 86px 1fr;
  column-gap: 14px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px dotted rgba(148, 163, 184, 0.18);
  font-size: 11.5px;
  line-height: 1.45;
}
.spec-line:last-child { border-bottom: none; }
.sk {
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}
.sv {
  color: #f8fafc;
  font-weight: 600;
  font-family: Consolas, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
  text-align: right;
  word-break: break-word;
}
.insp-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.45;
  padding: 4px;
}

/* CROSSHAIR FOR WALK MODE */
#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: none;
}
#crosshair::before, #crosshair::after {
  content: "";
  position: absolute;
  background: var(--cyan-accent);
}
#crosshair::before { left: 5px; top: 0; width: 2px; height: 12px; }
#crosshair::after { top: 5px; left: 0; height: 2px; width: 12px; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideLeft { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

/* ==========================================================================
   MOBILE & RESPONSIVE LAYOUT + VIRTUAL JOYSTICK
   ========================================================================== */
#mobileJoystickContainer {
  position: absolute;
  bottom: 85px;
  left: 20px;
  width: 120px;
  height: 120px;
  display: none;
  z-index: 900;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#mobileJoystickBase {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(56, 189, 248, 0.4);
  backdrop-filter: blur(8px);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
#mobileJoystickKnob {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(56, 189, 248, 0.85);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
  position: absolute;
  pointer-events: none;
  transition: transform 0.04s ease-out;
}
.joystick-hint {
  text-align: center;
  font-size: 9px;
  font-weight: 700;
  color: rgba(226, 232, 240, 0.7);
  letter-spacing: 0.12em;
  margin-top: 6px;
}

/* Close icon svg utility */
.svg-icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* Desktop default for mobile-only elements */
.mobile-nav-trigger {
  display: none;
}
.mobile-more-btn {
  display: none;
}
#btnMobileExitWalk {
  position: absolute;
  bottom: 16px;
  right: 16px;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(56, 189, 248, 0.5);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 950;
  cursor: pointer;
}

/* ==========================================================================
   MOBILE RESPONSIVE STYLES (PORTRAIT & LANDSCAPE PHONES)
   ========================================================================== */
@media (max-width: 860px), (max-height: 520px) {
  /* 1. TOP BAR: Compact Click-to-Expand Trigger */
  #topNav {
    top: 8px;
    width: 94vw;
    max-width: 440px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mobile-nav-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--cyan-accent);
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    pointer-events: auto;
  }
  .mobile-chevron {
    font-size: 9px;
    transition: transform 0.2s ease;
    opacity: 0.75;
  }
  .mobile-chevron.open {
    transform: rotate(180deg);
  }

  /* Facility Menu is Hidden by default on mobile, expands on click */
  .nav-capsule {
    display: none;
    flex-direction: column;
    width: 100%;
    margin-top: 6px;
    padding: 8px;
    border-radius: 14px;
    background: rgba(11, 20, 38, 0.94);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .nav-capsule.mobile-open {
    display: flex;
  }
  .nav-brand {
    display: none;
  }
  .nav-btn {
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 8px;
  }

  /* Floor selector sub-bar */
  #floorSubNav {
    width: 100%;
    justify-content: center;
    padding: 4px 6px;
    margin-top: 4px;
    border-radius: 10px;
  }
  .floor-pill {
    padding: 4px 8px;
    font-size: 11px;
  }

  /* 2. BOTTOM DOCK: Compact Mobile Pill */
  #bottomDock {
    bottom: 8px;
    width: 94vw;
    max-width: 420px;
    padding: 5px 8px;
    gap: 4px;
    justify-content: space-around;
    border-radius: 16px;
  }
  .dock-btn {
    padding: 6px 10px;
    font-size: 11.5px;
    gap: 4px;
    border-radius: 10px;
  }
  .dock-sep {
    display: none;
  }
  .dock-stat {
    display: none;
  }

  /* Secondary options collapsed on mobile */
  .dock-opt-btn {
    display: none;
  }
  .dock-opt-btn.mobile-show {
    display: inline-flex;
  }
  .mobile-more-btn {
    display: inline-flex;
  }

  /* 3. VIRTUAL JOYSTICK POSITION & Z-INDEX */
  #mobileJoystickContainer {
    bottom: 75px;
    left: 16px;
    width: 100px;
    height: 100px;
    z-index: 150;
  }
  #mobileJoystickBase {
    width: 90px;
    height: 90px;
  }
  #mobileJoystickKnob {
    width: 38px;
    height: 38px;
  }

  /* 4. MODALS & DRAWERS ADAPTED FOR PHONE & LANDSCAPE */
  #testDrawer {
    width: 100vw;
    max-width: 100vw;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 18px 18px 0 0;
    padding: 14px;
    box-sizing: border-box;
    max-height: 82vh;
    overflow-y: auto;
    z-index: 1000;
  }
  .test-btn-grid {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  #inspectorDrawer {
    width: 100vw;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    border-radius: 18px 18px 0 0;
    max-height: 65vh;

(function setupMobileControls() {
  var jContainer = document.getElementById('mobileJoystickContainer');
  var jBase = document.getElementById('mobileJoystickBase');
  var jKnob = document.getElementById('mobileJoystickKnob');
  if (!jContainer || !jBase || !jKnob) return;

  var touchId = null;
  var baseCenter = { x: 0, y: 0 };
  var maxRadius = 40;

  function updateBaseCenter() {
    var rect = jBase.getBoundingClientRect();
    baseCenter.x = rect.left + rect.width / 2;
    baseCenter.y = rect.top + rect.height / 2;
  }

  jContainer.addEventListener('touchstart', function(e) {
    if (touchId !== null) return;
    var t = e.changedTouches[0];
    touchId = t.identifier;
    updateBaseCenter();
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchmove', function(e) {
    if (touchId === null) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === touchId) {
        var dx = t.clientX - baseCenter.x;
        var dy = t.clientY - baseCenter.y;
        var dist = Math.hypot(dx, dy);
        var clampedDist = Math.min(dist, maxRadius);
        var angle = Math.atan2(dy, dx);

        var kx = Math.cos(angle) * clampedDist;
        var ky = Math.sin(angle) * clampedDist;
        jKnob.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';

        joystickInput.x = kx / maxRadius;
        joystickInput.y = ky / maxRadius;
        e.preventDefault();
        break;
      }
    }
  }, { passive: false });

  function resetJoystick() {
    touchId = null;
    jKnob.style.transform = 'translate(0px, 0px)';
    joystickInput.x = 0;
    joystickInput.y = 0;
  }

  window.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchId) {
        resetJoystick();
        break;
      }
    }
  });
  window.addEventListener('touchcancel', resetJoystick);

  // Touch look-around on right/upper portion of screen in Walk mode
  var lookTouchId = null;
  var lastLookPos = { x: 0, y: 0 };

  renderer.domElement.addEventListener('touchstart', function(e) {
    if (activeNav !== 'walk') return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      // Only treat touches outside joystick area as look gestures
      if (t.clientX > window.innerWidth * 0.35 || t.clientY < window.innerHeight - 200) {
        if (lookTouchId === null) {
          lookTouchId = t.identifier;
          lastLookPos.x = t.clientX;
          lastLookPos.y = t.clientY;
          break;
        }
      }
    }
  }, { passive: true });

  window.addEventListener('touchmove', function(e) {
    if (activeNav !== 'walk' || lookTouchId === null) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        var deltaX = t.clientX - lastLookPos.x;
        var deltaY = t.clientY - lastLookPos.y;
        lastLookPos.x = t.clientX;
        lastLookPos.y = t.clientY;

        // STRICT LEVEL HORIZON: YXZ Euler with roll (z) strictly locked to 0
        camera.rotation.order = 'YXZ';
        var euler = new THREE.Euler(0, 0, 0, 'YXZ');
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= deltaX * 0.0032;
        euler.x -= deltaY * 0.0028;
        euler.x = Math.max(-Math.PI / 2.25, Math.min(Math.PI / 2.25, euler.x));
        euler.z = 0; // ZERO ROLL - PREVENTS HORIZON TILT PERMANENTLY
        camera.quaternion.setFromEuler(euler);
        camera.rotation.z = 0;
        break;
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === lookTouchId) {
        lookTouchId = null;
        break;
      }
    }
  });
})();

function box(parent, x, y, z, w, h, d, mat, shadow) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (shadow !== false) m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// REALISTIC SINGLE SEAMLESS GABLED ROOF (NO DUPLICATE ROOFS, NO FLOATING EAVES)
function createGabledRoof(parent, x, baseY, z, width, length, height, roofMat, wallMat) {
  var g = new THREE.Group();
  g.position.set(x, baseY, z);
  parent.add(g);

  var overhang = 0.55;
  var roofThick = 0.22;
  var halfW = width / 2;
  var totalHalfW = halfW + overhang;
  var slopeLen = Math.sqrt(totalHalfW * totalHalfW + height * height);
  var angle = Math.atan2(height, totalHalfW);

  // Left roof slope
  var leftSlope = new THREE.Mesh(
    new THREE.BoxGeometry(slopeLen, roofThick, length + overhang * 2),
    roofMat
  );
  leftSlope.position.set(-totalHalfW / 2, height / 2, 0);
  leftSlope.rotation.z = angle;
  leftSlope.castShadow = true;
  leftSlope.receiveShadow = true;
  g.add(leftSlope);

  // Right roof slope
  var rightSlope = new THREE.Mesh(
    new THREE.BoxGeometry(slopeLen, roofThick, length + overhang * 2),
    roofMat
  );
  rightSlope.position.set(totalHalfW / 2, height / 2, 0);
  rightSlope.rotation.z = -angle;
  rightSlope.castShadow = true;
  rightSlope.receiveShadow = true;
  g.add(rightSlope);

  // Ridge cap along apex
  var ridge = new THREE.Mesh(
    new THREE.BoxGeometry(0.35, 0.18, length + overhang * 2 + 0.05),
    roofMat
  );
  ridge.position.set(0, height + 0.06, 0);
  g.add(ridge);

  // Gable end walls (triangular walls closing the front and back attic)
  var triShape = new THREE.Shape();
  triShape.moveTo(-halfW, 0);
  triShape.lineTo(0, height);
  triShape.lineTo(halfW, 0);
  triShape.closePath();

  var triGeom = new THREE.ExtrudeGeometry(triShape, { depth: 0.25, bevelEnabled: false });
  triGeom.center();

  var gableMat = wallMat || mats.wallExterior;

  var frontGable = new THREE.Mesh(triGeom, gableMat);
  frontGable.position.set(0, height / 2, length / 2 - 0.12);
  frontGable.castShadow = true;
  g.add(frontGable);

  var backGable = new THREE.Mesh(triGeom, gableMat);
  backGable.position.set(0, height / 2, -length / 2 + 0.12);
  backGable.castShadow = true;
  g.add(backGable);

  return g;
}

// LOW-POLY ARCHITECTURAL TREE
function createTree(parent, x, z, scale) {
  var s = scale || 1.0;
  var g = new THREE.Group();
  g.position.set(x, 0, z);
  parent.add(g);

  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * s, 0.32 * s, 2.4 * s, 6), mats.treeTrunk);
  trunk.position.y = 1.2 * s;
  trunk.castShadow = true;
  g.add(trunk);

  var c1 = new THREE.Mesh(new THREE.ConeGeometry(1.6 * s, 2.6 * s, 7), mats.treeLeaves);
  c1.position.y = 3.1 * s;
  c1.castShadow = true;
  g.add(c1);

  var c2 = new THREE.Mesh(new THREE.ConeGeometry(1.25 * s, 2.2 * s, 7), mats.treeLeaves);
  c2.position.y = 4.3 * s;

var billboardTags = [];

function makeTag(text, x, y, z, scale, tagType) {
  scale = scale || 1;
  tagType = tagType || 'device'; // 'building', 'room', 'device'
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  
  var fontSize = 24;
  var fontStr = 'bold ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.font = fontStr;

  var lines = text.split('\n');
  var maxWidth = 0;
  for (var i = 0; i < lines.length; i++) {
    var lw = ctx.measureText(lines[i]).width;
    if (lw > maxWidth) maxWidth = lw;
  }
  
  var padX = 24;
  var padY = 12;
  var lineHeight = fontSize * 1.35;
  var cw = Math.max(180, Math.ceil(maxWidth + padX * 2));
  var ch = Math.ceil(lineHeight * lines.length + padY * 2);
  
  c.width = cw;
  c.height = ch;

  ctx.font = fontStr;
  ctx.fillStyle = 'rgba(8, 15, 30, 0.82)'; // Translucent sleek dark background
  ctx.beginPath();
  ctx.roundRect(4, 4, cw - 8, ch - 8, 10);
  ctx.fill();
  
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  for (var i = 0; i < lines.length; i++) {
    var lineY = padY + lineHeight * (i + 0.5);
    ctx.fillStyle = (i === 0 && lines.length > 1) ? '#38bdf8' : '#f8fafc';
    ctx.fillText(lines[i], cw / 2, lineY);
  }

  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  
  var aspect = cw / ch;
  var planeHeight = (0.65 + lines.length * 0.22) * scale;
  var planeWidth = planeHeight * aspect;

  var plane = new THREE.Mesh(
    new THREE.PlaneGeometry(planeWidth, planeHeight),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
  );
  plane.position.set(x, y, z);
  plane.userData = { tagType: tagType, text: text };
  scene.add(plane);
  billboardTags.push(plane);
  return plane;
}

function streamSimLog(lines) {
  var consoleEl = document.getElementById('simConsole');
  if (!consoleEl) return;
  consoleEl.innerHTML = '';
  for (var i = 0; i < lines.length; i++) {
    (function(line, idx) {
      var tid = setTimeout(function() {
        if (idx === 0) consoleEl.innerHTML = line;
        else consoleEl.innerHTML += '<br>' + line;
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }, idx * 400);
      simLogTimeouts.push(tid);
    })(lines[i], i);
  }
}

function clearSimEffects() {
  for (var i = 0; i < simLogTimeouts.length; i++) clearTimeout(simLogTimeouts[i]);
  simLogTimeouts = [];

  for (var i = 0; i < activeSimBadges.length; i++) {
    scene.remove(activeSimBadges[i]);
    var bIdx = billboardTags.indexOf(activeSimBadges[i]);
    if (bIdx >= 0) billboardTags.splice(bIdx, 1);
  }
  activeSimBadges = [];

  for (var i = 0; i < activeShockwaves.length; i++) {
    scene.remove(activeShockwaves[i].mesh);
  }
  activeShockwaves = [];

  for (var i = 0; i < activeConduitMeshes.length; i++) {
    scene.remove(activeConduitMeshes[i]);
  }
  activeConduitMeshes = [];

  if (activeBarrierMesh) {

}

// Builds continuous glowing 3D laser conduit pipes along the hops
function buildConduitLine(p1, p2, colorHex) {
  var dir = new THREE.Vector3().subVectors(p2, p1);
  var len = dir.length();
  if (len < 0.05) return;
  var geom = new THREE.CylinderGeometry(0.12, 0.12, len, 8);
  var mat = new THREE.MeshBasicMaterial({
    color: colorHex,
    transparent: true,
    opacity: 0.88,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var cyl = new THREE.Mesh(geom, mat);
  cyl.renderOrder = 999990;
  var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  scene.add(cyl);
  activeConduitMeshes.push(cyl);
}

function buildConduitPath(points, colorHex) {
  for (var i = 0; i < points.length - 1; i++) {
    buildConduitLine(points[i], points[i + 1], colorHex);
  }
}

// High-contrast 3D billboard alert badge
function createSimBadge(title, subtitle, detail, pos, theme) {
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');

  var fTitle = 'bold 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  var fSub = 'bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  var fDet = '16px Consolas, monospace';

  ctx.font = fTitle;
  var w1 = ctx.measureText(title).width;
  ctx.font = fSub;
  var w2 = subtitle ? ctx.measureText(subtitle).width : 0;
  ctx.font = fDet;
  var w3 = detail ? ctx.measureText(detail).width : 0;

  var maxW = Math.max(w1, w2, w3, 240);
  var padX = 26;
  var padY = 16;
  var cw = Math.ceil(maxW + padX * 2);
  var ch = Math.ceil(34 + (subtitle ? 26 : 0) + (detail ? 24 : 0) + padY * 2);

  c.width = cw;
  c.height = ch;

  var colors = {
    danger:  { bg: 'rgba(69, 10, 10, 0.94)', border: '#ef4444', text: '#fca5a5', hl: '#ffffff' },
    success: { bg: 'rgba(6, 78, 59, 0.94)',  border: '#10b981', text: '#6ee7b7', hl: '#ffffff' },
    sync:    { bg: 'rgba(12, 74, 110, 0.94)', border: '#38bdf8', text: '#7dd3fc', hl: '#ffffff' },
    hsrp:    { bg: 'rgba(120, 53, 15, 0.94)', border: '#f59e0b', text: '#fde68a', hl: '#ffffff' }
  };
  var col = colors[theme] || colors.success;

  ctx.fillStyle = col.bg;
  ctx.beginPath();
  ctx.roundRect(4, 4, cw - 8, ch - 8, 12);
  ctx.fill();

  ctx.strokeStyle = col.border;
  ctx.lineWidth = 3.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var curY = padY + 16;
  ctx.font = fTitle;
  ctx.fillStyle = col.hl;
  ctx.fillText(title, cw / 2, curY);

  if (subtitle) {
    curY += 26;
    ctx.font = fSub;
    ctx.fillStyle = col.text;
    ctx.fillText(subtitle, cw / 2, curY);
  }

  if (detail) {
    curY += 24;
    ctx.font = fDet;
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(detail, cw / 2, curY);
  }

  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;

  var aspect = cw / ch;
  var planeHeight = 1.45;
  var planeWidth = planeHeight * aspect;

  var plane = new THREE.Mesh(
    new THREE.PlaneGeometry(planeWidth, planeHeight),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
  );
  plane.position.copy(pos);
  plane.userData = { tagType: 'sim_badge' };
  scene.add(plane);
  activeSimBadges.push(plane);
  billboardTags.push(plane);
  return plane;
}

  setTimeout(updateJoystickVisibility, 50);
  var bs = document.getElementById('simBigScreen');
  if (bs) bs.style.display = 'none';
}

function showTrackingPill(text) {
  var pill = document.getElementById('simTrackingPill');
  if (pill) {
    document.getElementById('trackLabel').textContent = text;
    pill.style.display = 'flex';
  }
}

function hideTrackingPill() {
  var pill = document.getElementById('simTrackingPill');
  if (pill) pill.style.display = 'none';
}

function openBigScreen(plan) {
  activeTestPlan = plan;
  hideTrackingPill();

  var bs = document.getElementById('simBigScreen');
  if (!bs) return;

  document.getElementById('bsIcon').textContent = plan.badge || 'VERIFIED';
  document.getElementById('bsTitle').textContent = plan.title;
  document.getElementById('bsSubtitle').textContent = plan.subtitle;

  var bBadge = document.getElementById('bsVerdictBadge');
  bBadge.className = 'big-screen-badge ' + (plan.badgeClass || 'badge-success');
  bBadge.textContent = plan.verdict || 'COMPLETED';

  document.getElementById('bsExplanation').innerHTML = plan.explanation;

  // Build Hops Flow (Completed Timeline with Checkmarks, zero scrollbar)
  var hCont = document.getElementById('bsHopsContainer');
  hCont.innerHTML = '';
  if (plan.hops && plan.hops.length > 0) {
    plan.hops.forEach(function(hop, idx) {
      if (idx > 0) {
        var arr = document.createElement('span');
        arr.className = 'hop-arrow';
        arr.textContent = '→';
        hCont.appendChild(arr);
      }
      var hDiv = document.createElement('div');
      var isDenyFinal = (plan.isDeny && idx === plan.hops.length - 1);
      hDiv.className = isDenyFinal ? 'hop-step completed-red' : 'hop-step completed';
      var checkIcon = isDenyFinal ? 'BLOCKED' : 'PASS';
      hDiv.innerHTML = '<span style="font-size:10px;margin-right:2px;">' + checkIcon + '</span> ' + hop;
      hCont.appendChild(hDiv);
    });
  }

  // Build Meta Items
  var mGrid = document.getElementById('bsMetaGrid');
  mGrid.innerHTML = '';
  if (plan.meta && plan.meta.length > 0) {
    plan.meta.forEach(function(m) {
      var it = document.createElement('div');
      it.className = 'bs-meta-item';
      it.innerHTML = '<div class="bs-meta-label">' + m.label + '</div><div class="bs-meta-val" title="' + m.value + '">' + m.value + '</div>';
      mGrid.appendChild(it);
    });
  }

  bs.style.display = 'block';
}

function replayActiveTest() {
  closeBigScreen();
  if (currentTestKey) {
    setTimeout(function() {
      if (currentTestKey === 'hsrp') toggleHSRP();
      else runSim(currentTestKey);
    }, 200);
  }
}

function runPacketTrace(points, colorHex, speed, onDone) {
  closeBigScreen();
  hideTrackingPill();

  packetAuraMat.color.set(colorHex);
  packetRingMat.color.set(colorHex);
  packetLight.color.set(colorHex);
  packetMesh.position.copy(points[0]);
  packetMesh.visible = true;

  // Set starting camera POV inside the building/room
  if (activeNav === 'orbit') {
    if (currentTestKey === 'inter_vlan') {
      // Intimate indoor POV inside Room 101 right next to the starting workstation
      camera.position.set(-25.8, 2.2, 17.2);
      orbit.target.copy(points[0]);
    } else if (currentTestKey === 'acl_block') {
      // Indoor POV inside Admin Building 2F next to Wi-Fi AP
      camera.position.set(13.5, 7.5, 20.2);
      orbit.target.copy(points[0]);
    } else if (currentTestKey === 'wan_sync') {
      // Indoor POV inside Second Branch Office
      camera.position.set(43.5, 4.2, -11.5);
      orbit.target.copy(points[0]);
    } else if (currentTestKey === 'branch_dia') {
      // Indoor POV inside Second Branch Office next to branch PC
      camera.position.set(30.0, 2.4, -18.5);
      orbit.target.copy(points[0]);
    } else {
      // Inside Studio Server Room
      camera.position.set(points[0].x - 3.8, points[0].y + 2.0, points[0].z + 4.2);
      orbit.target.copy(points[0]);
    }
    orbit.update();
  }

  var title = 'SENDING DATA ACROSS NETWORK...';
  if (currentTestKey === 'inter_vlan') title = 'TEST 1: Employee PC ➔ Office Switch ➔ Employee Server';
  else if (currentTestKey === 'acl_block') title = 'TEST 2: Guest Phone ➔ Cisco Firewall ➔ Access Blocked';
  else if (currentTestKey === 'wan_sync') title = 'TEST 3: Admin Server ➔ 500 Mbps Private Line ➔ Second Branch';
  else if (currentTestKey === 'branch_dia') title = 'TEST 4: Branch Computer ➔ 100 Mbps Direct Internet ➔ Cloud / Web';
  else if (currentTestKey === 'hsrp') title = 'TEST 5: Main Line Down ➔ Switching to Backup Internet (Globe)';
  showTrackingPill(title);

  packetAnim = {
    points: points,
    currentSegment: 0,
    progress: 0,
    speed: speed || 0.024,
    chaseCamera: true,
    onDone: onDone
  };
}

function selectFloor(floor, skipCam) {
  for (var i = 1; i <= 5; i++) {
    var p = document.getElementById('fp' + i);
    if (p) p.className = floor === i ? 'floor-pill active' : 'floor-pill';
  }
  var fpAll = document.getElementById('fpAll');
  if (fpAll) fpAll.className = floor === 'all' ? 'floor-pill active' : 'floor-pill';

  if (floor === 'all') {
    employeeFloors.forEach(function(fg) { fg.visible = true; });
    if (typeof empRoof !== 'undefined') empRoof.visible = true;
    if (!skipCam) tweenCam([-28, 24, 45], [-22, 7, 18]);
  } else {
    var fIndex = parseInt(floor) - 1;
    employeeFloors.forEach(function(fg, idx) {
      fg.visible = (idx === fIndex);
    });
    if (typeof empRoof !== 'undefined') empRoof.visible = false;
    var targetY = fIndex * 3.4;
    if (!skipCam) tweenCam([-22, targetY + 8, 30], [-22, targetY + 1.2, 18]);
  }
}

function tweenCam(pos, tgt) {
  var startCam = camera.position.clone();
  var startTgt = orbit.target.clone();
  var endCam = new THREE.Vector3(pos[0], pos[1], pos[2]);
  var endTgt = new THREE.Vector3(tgt[0], tgt[1], tgt[2]);
  var t = 0;

  function step() {
    t += 0.05;
    camera.position.lerpVectors(startCam, endCam, t);
    orbit.target.lerpVectors(startTgt, endTgt, t);
    orbit.update();
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

// -------------------------------------------------------------
// RAYCASTING FOR MOUSE CLICK ON DESKS / SERVERS
// -------------------------------------------------------------
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();

window.addEventListener('click', function(e) {
  if (e.target.closest('#topNav') || e.target.closest('#bottomDock') || e.target.closest('#testDrawer') || e.target.closest('#inspectorDrawer') || e.target.closest('#simBigScreen')) {
    return;
  }
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  var hits = raycaster.intersectObjects(interactiveObjects, true);
  if (hits.length > 0) {
    var hitObj = hits[0].object;
    while (hitObj && !hitObj.userData.id && hitObj.parent) {
      hitObj = hitObj.parent;
    }
    if (hitObj && hitObj.userData && hitObj.userData.id) {
      inspectDevice(hitObj.userData);
    }
  }
});

// WASD WALKTHROUGH CONTROLS
var keys = {};
window.addEventListener('keydown', function(e) { keys[e.code] = true; });
window.addEventListener('keyup', function(e) { keys[e.code] = false; });

// -------------------------------------------------------------
// ANIMATION LOOP (LOD TAGS & CAMERA)
// -------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);

  // STRICT LEVEL HORIZON: Never allow camera to roll / tilt diagonally
  if (camera.rotation.z !== 0) camera.rotation.z = 0;
  camera.up.set(0, 1, 0);

  if (activeNav === 'orbit' && (!packetAnim || !packetAnim.chaseCamera)) {
    orbit.update();
  } else if (activeNav === 'walk') {
    if (walk.isLocked) {
      var speed = keys.ShiftLeft ? 0.32 : 0.16;
      if (keys.KeyW || keys.ArrowUp) walk.moveForward(speed);
      if (keys.KeyS || keys.ArrowDown) walk.moveForward(-speed);
      if (keys.KeyA || keys.ArrowLeft) walk.moveRight(-speed);
      if (keys.KeyD || keys.ArrowRight) walk.moveRight(speed);
    }
    // Mobile Virtual Joystick Input
    if (joystickInput.x !== 0 || joystickInput.y !== 0) {
      var jSpeed = 0.16;
      walk.moveForward(-joystickInput.y * jSpeed);
      walk.moveRight(joystickInput.x * jSpeed);
    }
    walk.getObject().position.y = 1.65;
  }

  // Refined Smart Distance LOD (Zero Sky Clutter)
  var cPos = camera.position;
  for (var bIdx = 0; bIdx < billboardTags.length; bIdx++) {
    var bTag = billboardTags[bIdx];
    bTag.quaternion.copy(camera.quaternion);

    if (labelMode === 'off') {
      bTag.visible = false;
      continue;
    }
    if (labelMode === 'minimal') {
      bTag.visible = (bTag.userData.tagType === 'building');
      continue;
    }

    // Smart LOD
    var dDist = cPos.distanceTo(bTag.position);
    if (bTag.userData.tagType === 'sim_badge') {
      // Simulation reaction badges are ALWAYS 100% visible
      bTag.visible = true;
    } else if (bTag.userData.tagType === 'building') {
      bTag.visible = dDist > 14;
    } else if (bTag.userData.tagType === 'room') {
      bTag.visible = dDist < 32;
    } else { // 'device'
      bTag.visible = dDist < 38;
    }
  }

  // Pulse WAN lines
  var time = performance.now() * 0.002;
  if (!isPLDTCut) {
    linePrimaryWAN.material.opacity = 0.5 + 0.45 * Math.sin(time * 3);
    lineBackupWAN.material.opacity = 0.35 + 0.2 * Math.sin(time * 2);
  } else {
    linePrimaryWAN.material.opacity = 0.25;
    lineBackupWAN.material.opacity = 0.7 + 0.3 * Math.sin(time * 5);
  }

  // Animate expanding floor shockwave rings
  for (var swI = activeShockwaves.length - 1; swI >= 0; swI--) {
    var sw = activeShockwaves[swI];
    sw.scale += sw.speed;
    sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
    sw.opacity -= 0.022;
    sw.mesh.material.opacity = Math.max(0, sw.opacity);
    if (sw.opacity <= 0 || sw.scale >= sw.maxScale) {
      scene.remove(sw.mesh);
      activeShockwaves.splice(swI, 1);
    }
  }

  // Animate firewall barrier pulse
  if (activeBarrierMesh) {
    var bTime = performance.now() * 0.008;
    activeBarrierMesh.children[0].material.opacity = 0.45 + 0.35 * Math.sin(bTime);
    activeBarrierMesh.children[2].intensity = 4.0 + 2.5 * Math.sin(bTime * 2);
  }

  // Animate packet flight with dynamic drone chase camera
  if (packetAnim) {
    packetAnim.progress += packetAnim.speed;
    var pts = packetAnim.points;
    var seg = packetAnim.currentSegment;

    if (seg < pts.length - 1) {
      packetMesh.position.lerpVectors(pts[seg], pts[seg + 1], packetAnim.progress);

      var pTime = performance.now() * 0.015;
      packetLight.intensity = 5.5 + 2.5 * Math.sin(pTime);
      var ringScale = 1.0 + 0.22 * Math.sin(pTime * 2);
      packetRing.scale.set(ringScale, ringScale, ringScale);
      packetRing.rotation.z += 0.05;

      // Smart adaptive camera chase (Intimate indoor room view vs outdoor campus view)
      if (packetAnim.chaseCamera && activeNav === 'orbit') {
        orbit.target.lerp(packetMesh.position, 0.18);

        var isOutdoor = false;
        if (currentTestKey === 'inter_vlan') {
          // Packet enters outdoor courtyard conduit between Floor 1 and Studio Server Room
          if (packetAnim.currentSegment >= 3 && packetMesh.position.z > -14) {
            isOutdoor = true;
            // Restore full building once packet leaves Floor 1
            selectFloor('all', true);
          }
        } else if (currentTestKey === 'wan_sync') {
          // Aerial leased line across campus
          if (packetMesh.position.y > 4.0 || (packetMesh.position.x > -15 && packetMesh.position.x < 35)) {
            isOutdoor = true;
          }
        } else if (currentTestKey === 'branch_dia') {
          // Breakout high into cloud
          if (packetMesh.position.y > 5.5) {
            isOutdoor = true;
          }
        }

        var desiredX, desiredY, desiredZ;
        if (isOutdoor) {
          // Smooth elevated outdoor campus view
          desiredX = packetMesh.position.x - 10.0;
          desiredY = packetMesh.position.y + 8.5;
          desiredZ = packetMesh.position.z + 12.0;
        } else {
          // Intimate indoor room POV (close to desks and server racks, under ceiling)
          desiredX = packetMesh.position.x - 3.2;
          desiredY = packetMesh.position.y + 1.8;
          desiredZ = packetMesh.position.z + 3.8;
        }

        camera.position.x += (desiredX - camera.position.x) * 0.12;
        camera.position.y += (desiredY - camera.position.y) * 0.12;
        camera.position.z += (desiredZ - camera.position.z) * 0.12;
        orbit.update();
      }

      if (packetAnim.progress >= 1.0) {
        packetAnim.progress = 0;
        packetAnim.currentSegment++;
      }
    } else {
      packetMesh.visible = false;
      hideTrackingPill();
      var doneCb = packetAnim.onDone;
      packetAnim = null;
      if (doneCb) doneCb();
    }
  }

  renderer.render(scene, camera);
}
animate();

// URL Query Param Support for direct testing / automated demonstration
window.addEventListener('load', function() {
  try {
    var params = new URLSearchParams(window.location.search);
    var test = params.get('test');
    if (test) {
      toggleTestDrawer();
      setTimeout(function() {
        if (test === 'hsrp') toggleHSRP();
        else runSim(test);
      }, 500);
    }
  } catch(e) {}
});

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
